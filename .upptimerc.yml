owner: feasable
repo: feasable-uptime

sites:
  - name: Feasable API
    url: https://api.feasable.org/v1/health
  - name: Feasable Payments
    url: https://pay.feasable.org/v1/health
  - name: Feasable Checkout
    url: https://checkout.feasable.org/v1/health
  - name: Feasable Staging API
    url: https://staging-api.feasable.org/v1/health
  - name: Feasable Staging Payments
    url: https://staging-pay.feasable.org/v1/health
  - name: Feasable Staging Checkout
    url: https://staging-checkout.feasable.org/v1/health
  - name: UptimeKit Dashboard
    url: https://uptime.feasable.org/api/health
  - name: Feasable Status Page
    url: https://status.feasable.org/feasable
  - name: Para Free Proxy
    url: https://api.parastus.me/api/ping

status-website:
  cname: status.feasable.org
  # baseUrl: /feasable-uptime
  logoUrl: https://feasable.org/favicon.ico
  name: Feasable Status
  introTitle: "**Feasable** platform status"
  introMessage: Real-time availability of Feasable services, monitored independently by Upptime on GitHub Actions.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/feasable/feasable-uptime

notifications:
  - type: webhook
    url: https://api.resend.com/emails
    method: POST
    headers:
      Authorization: "Bearer $RESEND_API_KEY"
      Content-Type: "application/json"
    body: |
      {
        "from": "status@feasable.org",
        "to": ["admin@feasable.org"],
        "subject": "Feasable monitor $SITE_NAME is $STATUS",
        "text": "Monitor $SITE_NAME ($SITE_URL) reported $STATUS at $TIMESTAMP.\n\nView live status: https://status.feasable.org"
      }
